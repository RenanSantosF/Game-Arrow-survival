# Compila o APK Android a cada envio para a branch main e publica em
# "Releases" (na página do repositório), para baixar e instalar direto no celular.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  # Godot 4.7.2: bibliotecas Android alinhadas em 16 KB (exigência da Google Play
  # para Android 15+) e alvo API 36.
  GODOT_VERSION: "4.7.2"
  GODOT_SETTINGS: "4.7"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Godot e dos export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-gradle-v3

      - name: Baixar Godot e export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          rm Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz \
            templates/android_debug.apk templates/android_release.apk templates/android_source.zip \
            templates/version.txt -d "$T"
          rm Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('addons/admob/android/bin/**/*.gd') }}

      - name: Instalar Android SDK 36 (build-tools e NDK do Godot 4.7.2)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" > /dev/null

      - name: Configurar Android SDK e Java no Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_SETTINGS}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-${GODOT_SETTINGS}.tres
          cat ~/.config/godot/editor_settings-${GODOT_SETTINGS}.tres

      - name: Compilar APK e AAB
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            echo "$UPLOAD_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            export UPLOAD_KEYSTORE_PATH="$RUNNER_TEMP/upload.keystore"
          fi
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 \
          VERSION_CODE=${{ github.run_number }} \
          tools/build_apk.sh
          rm -f "$RUNNER_TEMP/upload.keystore"
          test -f build/ArrowSurvival.apk
          test -f build/ArrowSurvival.aab

      - name: Publicar APK e AAB em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mais-recente
          name: "Arrow Survival — APK mais recente (build ${{ github.run_number }})"
          body: |
            APK gerado automaticamente a partir do commit ${{ github.sha }}.
            Baixe **ArrowSurvival.apk** abaixo pelo celular e instale.
            **ArrowSurvival.aab** é o pacote para a Google Play (veja no README como assinar com a chave de upload).
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          files: |
            build/ArrowSurvival.apk
            build/ArrowSurvival.aab

      - name: Guardar APK e AAB como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ArrowSurvival-android
          path: |
            build/ArrowSurvival.apk
            build/ArrowSurvival.aab
