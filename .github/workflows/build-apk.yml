# Compila o APK Android a cada envio para a branch main e publica em
# "Releases" (na página do repositório), para baixar e instalar direto no celular.
name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache do Godot e dos export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-gradle-v2

      - name: Baixar Godot e export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          cd ~/godot
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          rm Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          T=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$T"
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz \
            templates/android_debug.apk templates/android_release.apk templates/android_source.zip \
            templates/version.txt -d "$T"
          rm Godot_v${GODOT_VERSION}-stable_export_templates.tpz

      - name: Cache do Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('addons/admob/android/bin/**/*.gd') }}

      - name: Instalar Android SDK 36 (exigido pelo plugin AdMob)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;34.0.0" > /dev/null

      - name: Configurar Android SDK e Java no Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOT
          sed -i 's/^ *//' ~/.config/godot/editor_settings-${GODOT_VERSION}.tres
          cat ~/.config/godot/editor_settings-${GODOT_VERSION}.tres

      - name: Compilar APK (e AAB para a Play Store)
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: |
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 \
          VERSION_CODE=${{ github.run_number }} \
          tools/build_apk.sh
          test -f build/ArrowSurvival.apk

      - name: Publicar APK em Releases
        id: release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mais-recente
          name: "Arrow Survival — APK mais recente (build ${{ github.run_number }})"
          body: |
            APK gerado automaticamente a partir do commit ${{ github.sha }}.
            Baixe **ArrowSurvival.apk** abaixo pelo celular e instale.
          prerelease: false
          make_latest: true
          files: build/ArrowSurvival.apk

      # A API do GitHub às vezes falha por instantes: tenta de novo uma vez.
      - name: Publicar APK em Releases (nova tentativa)
        if: steps.release.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-mais-recente
          name: "Arrow Survival — APK mais recente (build ${{ github.run_number }})"
          body: |
            APK gerado automaticamente a partir do commit ${{ github.sha }}.
            Baixe **ArrowSurvival.apk** abaixo pelo celular e instale.
          prerelease: false
          make_latest: true
          files: build/ArrowSurvival.apk

      - name: Guardar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ArrowSurvival-apk
          path: build/ArrowSurvival.apk

      # O AAB (Play Store) fica só aqui, na página da execução em "Actions" (não é público).
      - name: Guardar AAB da Play Store
        if: hashFiles('build/ArrowSurvival.aab') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ArrowSurvival-PlayStore-aab
          path: build/ArrowSurvival.aab
